[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

; php.ini を丸ごと差し替えているため、公式の php.ini-production 相当を明示する。
; 警告がレスポンス本文に混入すると JSON も CORS ヘッダも壊れる
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; opcache.validate_timestamps=0 ローカルではキャッシュの破棄を有効（デフォルト）にする
