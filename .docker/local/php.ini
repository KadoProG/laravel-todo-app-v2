[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

; 非推奨警告が JSON レスポンスの本文に混入して CORS ヘッダごと壊すのを防ぐ。
; エラーは画面に出さずログにだけ残す（Laravel 側で別途ハンドリングされる）
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; opcache.validate_timestamps=0 ローカルではキャッシュの破棄を有効（デフォルト）にする
