user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ALB 経由のアクセスログを stdout に出し、CloudWatch Logs で拾えるようにする
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # ALB は自身が HTTP で受けるため X-Forwarded-Proto に http を入れてしまう。
    # 実際のビューアとのプロトコルは CloudFront が付けるヘッダにあるので、
    # そちらがあれば優先し、無ければ ALB の値をそのまま使う。
    map $http_cloudfront_forwarded_proto $forwarded_proto {
        default   $http_x_forwarded_proto;
        "https"   "https";
        "http"    "http";
    }

    # X-Forwarded-Port は ALB のリスナーポート（80）のままなので、上で決めた
    # プロトコルと食い違う。https と 80 が組み合わさると絶対 URL に :80 が残り、
    # ブラウザが 80 番へ TLS 接続して ERR_SSL_PROTOCOL_ERROR になる。
    map $forwarded_proto $forwarded_port {
        default   "80";
        "https"   "443";
    }

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            # include の後に置き、fastcgi_params の既定値を上書きする
            fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
